<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수행평가 점수 확인</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 20px; padding: 10px; }
  input, button { padding: 10px; font-size: 16px; margin: 5px; box-sizing: border-box; }
  input { width: calc(100% - 90px); max-width: 200px; }
  #result { margin-top: 20px; border: 1px solid #ddd; padding: 20px; text-align: left; max-width: 800px; width: 100%; display: none; margin-left: auto; margin-right: auto; box-sizing: border-box; }
  .student-info { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #333; padding-bottom: 10px; }
  .total-row { font-size: 1.1em; margin-bottom: 20px; padding: 15px; background-color: #f1f8ff; border-radius: 5px; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px; text-align: center; }
  .total-item { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .total-label { font-weight: bold; margin-bottom: 5px; }
  .score-text { font-weight: bold; color: #0056b3; font-size: 1.2em; }
  .detail-link { font-size: 0.8em; margin-top: 8px; color: #555; cursor: pointer; text-decoration: underline; }
  .scores-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; }
  .score-box { border: 1px solid #eee; padding: 10px 5px; text-align: center; background-color: #fafafa; border-radius: 4px; }
  .score-header { font-weight: bold; display: block; font-size: 0.9em; margin-bottom: 5px; word-break: keep-all; }
  .score-value { font-weight: normal; display: block; font-size: 1em; }
  
  @media (max-width: 768px) {
    .scores-grid { grid-template-columns: repeat(5, 1fr); }
  }
  @media (max-width: 480px) {
    .scores-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
<h2>2026학년도 기하 수행평가 점수 조회</h2>
<div>
  <input type="text" id="studentId" placeholder="학번 입력">
  <button onclick="searchScore()">조회</button>
</div>
<div id="result"></div>

<script>
const scriptUrl = 'https://script.google.com/macros/s/AKfycbwqPUqzg0xL_d5k_akw3eiMlQl_jhv6HUxEj1mhAffpEfeZYhAVZdTt2mKufeqBh2WiSw/exec';

function searchScore() {
  const id = document.getElementById('studentId').value;
  const resultDiv = document.getElementById('result');
  
  if(!id) {
    alert('학번을 입력하세요.');
    return;
  }
  
  resultDiv.innerHTML = '조회 중...';
  resultDiv.style.display = 'block';

  fetch(`${scriptUrl}?id=${id}`)
    .then(res => res.json())
    .then(data => {
      if(data.success) {
        let html = `<div class="student-info">${data.data['이름']} (${data.data['학번']})</div>`;
        
        let score1 = data.data['수행평가(1)'] !== undefined && data.data['수행평가(1)'] !== "" ? data.data['수행평가(1)'] : 0;
        let score2 = data.data['수행평가(2)'] !== undefined && data.data['수행평가(2)'] !== "" ? data.data['수행평가(2)'] : 0;
        
        let calculatedScore3 = 1;
        let detailHtml = '';
        
        for(let i=1; i<=33; i++) {
          let key = i + '차시';
          if(data.data[key] !== undefined && data.data[key] !== "") {
            calculatedScore3 += Number(data.data[key]);
            detailHtml += `
              <div class="score-box">
                <span class="score-header">${key}</span>
                <span class="score-value">${data.data[key]}</span>
              </div>
            `;
          }
        }
        
        let displayScore3 = (data.data['수행평가(3)'] !== undefined && data.data['수행평가(3)'] !== "") ? data.data['수행평가(3)'] : calculatedScore3;

        html += `
          <div class="total-row">
            <div class="total-item">
              <span class="total-label">수행평가(1)</span>
              <span class="score-text">${score1}점</span>
            </div>
            <div class="total-item">
              <span class="total-label">수행평가(2)</span>
              <span class="score-text">${score2}점</span>
            </div>
            <div class="total-item">
              <span class="total-label">수행평가(3)</span>
              <span class="score-text">${displayScore3}점</span>
              <a class="detail-link" onclick="toggleDetails()">[차시별 점수 보기]</a>
            </div>
          </div>
        `;
        
        if (detailHtml !== '') {
          html += `<div id="detail-grid" class="scores-grid" style="display:none;">${detailHtml}</div>`;
        }
        
        resultDiv.innerHTML = html;
      } else {
        resultDiv.innerHTML = data.message;
      }
    })
    .catch(err => {
      resultDiv.innerHTML = '조회 중 오류가 발생했습니다.';
    });
}

function toggleDetails() {
  const grid = document.getElementById('detail-grid');
  if (grid) {
    if (grid.style.display === 'none') {
      grid.style.display = 'grid';
    } else {
      grid.style.display = 'none';
    }
  }
}
</script>
</body>
</html>
